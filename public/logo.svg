<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 110" role="img" aria-label="Infinity Aura logo">
  <defs>
    <linearGradient id="ribbonA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6fd0"/>
      <stop offset="55%" stop-color="#1d9e6e"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
    <linearGradient id="ribbonB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="50%" stop-color="#1d9e6e"/>
      <stop offset="100%" stop-color="#1a5fb8"/>
    </linearGradient>
    <radialGradient id="ocean" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#4aa8e8"/>
      <stop offset="60%" stop-color="#1f6fd0"/>
      <stop offset="100%" stop-color="#154f9e"/>
    </radialGradient>
  </defs>

  <!-- Infinity ribbon -->
  <path d="M57 20 C24 20 24 90 57 90 C78 90 94 68 110 55 C126 42 142 20 163 20 C196 20 196 90 163 90 C142 90 126 68 110 55 C94 42 78 20 57 20 Z"
        fill="none" stroke="url(#ribbonA)" stroke-width="13" stroke-linecap="round"/>
  <!-- Highlight sweep for layered ribbon feel -->
  <path d="M163 20 C196 20 196 90 163 90 C142 90 126 68 110 55"
        fill="none" stroke="url(#ribbonB)" stroke-width="13" stroke-linecap="round" opacity="0.85"/>

  <!-- Globe in left loop -->
  <circle cx="57" cy="55" r="24" fill="url(#ocean)" stroke="#ffffff" stroke-width="3"/>
  <g fill="#3fbf6f" stroke="none" opacity="0.95">
    <path d="M44 42 q6 -5 12 -3 q7 2 5 7 q-2 4 -8 4 q-7 1 -10 -3 q-2 -3 1 -5 Z"/>
    <path d="M62 55 q8 -2 12 3 q3 5 -2 9 q-5 4 -10 1 q-5 -3 -4 -8 q1 -4 4 -5 Z"/>
    <path d="M42 60 q5 -1 7 3 q2 4 -2 7 q-5 2 -8 -2 q-2 -5 3 -8 Z"/>
  </g>
</svg>
